services:
  - type: web
    name: kaijaklike-bot
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && (test -f patches/referral_master_5pct.patch && patch -p1 --forward < patches/referral_master_5pct.patch || true) && (test -f patches/master_port_429.patch && patch -p1 --forward < patches/master_port_429.patch || true) && (test -f patches/inject_fox_master.py && python patches/inject_fox_master.py || true) && (test -f patches/fix_callback_64.py && python patches/fix_callback_64.py || true)
    startCommand: python kaijaklike_bot.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
