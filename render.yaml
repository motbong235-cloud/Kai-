# KaiJakLike Bot + KaiPay — Render Blueprint
services:
  - type: web
    name: kaijaklike-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && (test -f patches/referral_master_5pct.patch && patch -p1 --forward < patches/referral_master_5pct.patch || true) && (test -f patches/master_port_429.patch && patch -p1 --forward < patches/master_port_429.patch || true) && (test -f patches/inject_fox_master.py && python patches/inject_fox_master.py || true)
    startCommand: python kaijaklike_bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: KAIPAY_URL
        sync: false
      - key: KAIPAY_API_KEY
        sync: false
      - key: CONTROL_KEY
        generateValue: true
      - key: BOT_DISPLAY_NAME
        value: KaiJakLike
      - key: DEP_QR_COOLDOWN_SEC
        value: "15"
      - key: FOX_UID
        sync: false
      - key: FOX_API_KEY
        sync: false
      - key: FOX_API_SECRET
        sync: false
      - key: ABA_API_KEY
        sync: false
      - key: ABA_MERCHANT_ID
        sync: false
      - key: BAKONG_API_TOKEN
        sync: false
      - key: PREMIUM_EMOJI_JSON
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
  - type: web
    name: kaipay
    runtime: python
    plan: free
    region: singapore
    rootDir: kaipay
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: BAKONG_TOKEN
        sync: false
      - key: BAKONG_ACCOUNT_ID
        sync: false
      - key: BAKONG_MERCHANT_NAME
        value: KaiPay
      - key: BAKONG_MERCHANT_CITY
        value: Phnom Penh
      - key: BAKONG_CURRENCY
        value: USD
      - key: QR_PER_USD
        value: "300"
      - key: MIN_TOPUP_USD
        value: "1"
      - key: FREE_QR_ON_SIGNUP
        value: "0"
      - key: PYTHON_VERSION
        value: "3.11.0"
