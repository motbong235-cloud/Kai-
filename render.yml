services:
  - type: web
    name: kaijaklike-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: python kaijaklike_bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: CAMRAPID_API_KEY
        sync: false
      - key: BAKONG_API_TOKEN
        sync: false
      - key: CONTROL_KEY
        sync: false
      - key: DATA_DIR
        value: .
      - key: BOT_DISPLAY_NAME
        value: KaiJakLike
      - key: BOT_WELCOME_MSG
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
